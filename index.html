    .notif-box{padding:14px 16px;margin:10px 0}.notif-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}.notif-row:last-child{border-bottom:0}.notif-copy b{display:block}.notif-copy span{font-size:12px;color:var(--muted);display:block;margin-top:3px}.switch{position:relative;width:50px;height:29px;flex:none}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#e6dce0;border-radius:999px;transition:.2s}.slider:before{content:"";position:absolute;width:23px;height:23px;left:3px;top:3px;background:#fff;border-radius:50%;box-shadow:0 2px 5px rgba(0,0,0,.15);transition:.2s}.switch input:checked + .slider{background:#ce8fa2}.switch input:checked + .slider:before{transform:translateX(21px)}.push-state{padding:11px 13px;border-radius:14px;background:var(--soft);font-size:13px;margin:10px 0}.push-state.ok{background:#e4f1e5;color:#47704d}.push-state.warn{background:#fff1db;color:#8b641f}.notif-select{width:100%;margin-top:8px}

<nav class="tabs hidden" id="tabs">
  <button data-tab="home" onclick="go('home')"><span class="ticon">⌂</span><span>Home</span></button>
  <button data-tab="calendar" onclick="go('calendar')"><span class="ticon">▦</span><span>Calendario</span></button>
  <button data-tab="clients" onclick="go('clients')"><span class="ticon">👤</span><span>Clienti</span></button>
  <button data-tab="services" onclick="go('services')"><span class="ticon">✂</span><span>Servizi</span></button>

<div class="modal" id="modal" onclick="if(event.target===this) closeModal()"><div class="sheet" id="sheet"></div></div>
<script>
const DEFAULT_SERVICES = [
  {id:"s1",name:"Make-up cerimonia",category:"Make-up",price:35,duration:120},
  {id:"s2",name:"Make-up evento",category:"Make-up",price:50,duration:90},
  {id:"s3",name:"Make-up sposa",category:"Make-up",price:60,duration:120},
  {id:"s4",name:"Prova trucco",category:"Make-up",price:10,duration:60},
  {id:"s5",name:"Semipermanente",category:"Unghie",price:25,duration:60},
  {id:"s6",name:"Gel",category:"Unghie",price:35,duration:90},
  {id:"s7",name:"Ricostruzione",category:"Unghie",price:40,duration:120},
  {id:"s8",name:"Refill",category:"Unghie",price:30,duration:60}
];
let db = loadDB(); migrateClientFields();
let currentTab = "home";
let selectedDate = isoDate(new Date());
let calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
let incomeFilter = "today";
let showIntro = true;
let notificationPrefs = loadNotificationPrefs();
let pushConfigured = false;
let pushReady = false;
const PUSH_USER_ID = "vc-beauty-valeria";

function loadNotificationPrefs(){
  const defaults = {work:true, personal:true, unconfirmed:true, unpaid:true, dailySummary:false, leadMinutes:60};
  try { return {...defaults, ...JSON.parse(localStorage.getItem("vc_beauty_notification_prefs") || "{}")}; } catch(e) { return defaults; }
}
function saveNotificationPrefs(){
  localStorage.setItem("vc_beauty_notification_prefs", JSON.stringify(notificationPrefs));
}
function setNotifPref(key, value){
  notificationPrefs[key] = value;
  saveNotificationPrefs();
  syncAllPushReminders().catch(()=>{});
}

async function initOneSignalPush(){
  try{
    const cfgResp = await fetch('/.netlify/functions/push-config', {cache:'no-store'});
    if(!cfgResp.ok) return;
    const cfg = await cfgResp.json();
    pushConfigured = !!cfg.configured;
    if(!pushConfigured) return;
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    window.OneSignalDeferred.push(async function(OneSignal){
      try{
        await OneSignal.init({
          appId: cfg.appId,
          serviceWorkerPath: "push/onesignal/OneSignalSDKWorker.js",
          serviceWorkerParam: { scope: "/push/onesignal/" },
          notifyButton: { enable: false }
        });
        await OneSignal.login(cfg.externalId || PUSH_USER_ID);
        pushReady = true;
        OneSignal.Notifications.addEventListener('permissionChange', function(){
          syncAllPushReminders().catch(()=>{});
          if(currentTab==='settings') render();
        });
      }catch(e){ console.warn('OneSignal init', e); }
    });
  }catch(e){ console.warn('Push config', e); }
}
function getPushPermission(){
  if(!('Notification' in window)) return 'unsupported';
  return Notification.permission;
}
async function requestPushPermission(){
  if(!pushConfigured){ alert('La parte push non è ancora collegata a OneSignal. Completa la configurazione indicata nel README.'); return; }
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  window.OneSignalDeferred.push(async function(OneSignal){
    try{
      await OneSignal.login(PUSH_USER_ID);
      await OneSignal.Notifications.requestPermission();
      await syncAllPushReminders();
      openNotificationSettings();
    }catch(e){ alert('Non sono riuscito ad attivare le notifiche. Controlla le impostazioni dell’iPhone.'); }
  });
}
async function sendPushRequest(payload){
  const r = await fetch('/.netlify/functions/push-schedule', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error || 'Errore push');
  return data;
}
async function cancelPush(id){
  if(!id) return;
  await fetch('/.netlify/functions/push-cancel', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id})}).catch(()=>{});
}
function loadScheduledPushIds(){ try{return JSON.parse(localStorage.getItem('vc_beauty_scheduled_push_ids')||'[]')}catch{return []} }
function saveScheduledPushIds(ids){ localStorage.setItem('vc_beauty_scheduled_push_ids', JSON.stringify(ids)); }
function futureIso(date){ return date instanceof Date && !isNaN(date) && date.getTime() > Date.now()+15000 ? date.toISOString() : null; }
function reminderTimeFor(date,time,minutesBefore){ const d=parseDT(date,time); return new Date(d.getTime()-Number(minutesBefore||60)*60000); }
async function syncAllPushReminders(){
  if(!pushConfigured || getPushPermission()!=='granted') return;
  const oldIds = loadScheduledPushIds();
  await Promise.allSettled(oldIds.map(cancelPush));
  const newIds=[];
  const lead=Number(notificationPrefs.leadMinutes||60);
  const siteUrl=location.origin + location.pathname;
  async function schedule(title,message,when,key){
    const iso=futureIso(when); if(!iso) return;
    try{
      const d=await sendPushRequest({title,message,sendAfter:iso,externalId:PUSH_USER_ID,url:siteUrl,idempotencyKey:key});
      if(d && d.id) newIds.push(d.id);
    }catch(e){ console.warn('schedule',e); }
  }
  for(const a of db.appointments){
    const s=serviceObj(a.serviceId), c=clientObj(a.clientId), start=parseDT(a.date,a.time);
    if(notificationPrefs.work) await schedule('Appuntamento in arrivo', `${c?.name||'Cliente'} · ${s?.name||'Servizio'} alle ${fmtTime(a.time)}`, reminderTimeFor(a.date,a.time,lead), `work-${a.id}-${lead}`);
    if(notificationPrefs.unconfirmed && !a.paid) await schedule('Appuntamento da confermare', `${c?.name||'Cliente'} · ${shortDate(a.date)} alle ${fmtTime(a.time)}`, new Date(start.getTime()-24*60*60000), `confirm-${a.id}`);
    if(notificationPrefs.unpaid && !a.paid){
      const end=new Date(start.getTime()+Number(s?.duration||60)*60000+60*60000);
      await schedule('Pagamento da controllare', `${c?.name||'Cliente'} · ${s?.name||'Servizio'} · ${money(a.price)}`, end, `pay-${a.id}`);
    }
  }
  if(notificationPrefs.personal){
    for(const p of db.personal){ await schedule('Impegno personale', `${p.title} alle ${fmtTime(p.time)}`, reminderTimeFor(p.date,p.time,lead), `personal-${p.id}-${lead}`); }
  }
  if(notificationPrefs.dailySummary){
    const byDay={};
    for(const a of db.appointments){ (byDay[a.date] ||= {w:0,p:0}); byDay[a.date].w++; }
    for(const p of db.personal){ (byDay[p.date] ||= {w:0,p:0}); byDay[p.date].p++; }
    for(const [date,counts] of Object.entries(byDay)){
      const when=new Date(`${date}T08:00:00`);
      await schedule('Riepilogo di oggi', `${counts.w} appuntamenti · ${counts.p} impegni personali`, when, `daily-${date}`);
    }
  }
  saveScheduledPushIds(newIds);
}
async function sendTestPush(){
  if(getPushPermission()!=='granted'){ await requestPushPermission(); return; }
  try{
    await sendPushRequest({title:'VC Beauty',message:'Le notifiche funzionano correttamente 💗',externalId:PUSH_USER_ID,url:location.origin+location.pathname,idempotencyKey:`test-${Date.now()}`});
    alert('Notifica di prova inviata. Dovrebbe arrivare tra pochi secondi.');
  }catch(e){ alert('Non riesco a inviare la notifica di prova: '+e.message); }
}

function loadDB(){
  const keys = ["vc_beauty_db_v13","vc_beauty_db_v12","vc_beauty_db_v2","mua_pwa_db_v1"];
  for(const key of keys){
    const raw = localStorage.getItem(key);
    if(raw){ try{ const d=JSON.parse(raw); d.clients ||= []; d.services ||= JSON.parse(JSON.stringify(DEFAULT_SERVICES)); d.appointments ||= []; d.personal ||= []; return d; }catch(e){} }
  }
  return {clients:[],services:JSON.parse(JSON.stringify(DEFAULT_SERVICES)),appointments:[],personal:[]};
}
function migrateClientFields(){ db.clients = (db.clients||[]).map(c=>({...c,address:c.address||"",city:c.city||""})); saveDB(false); }
function saveDB(doRender=true){ localStorage.setItem("vc_beauty_db_v13", JSON.stringify(db)); if(doRender) render(); }
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : Date.now()+"_"+Math.random()); }
function isoDate(d){ const x=new Date(d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`; }
function fmtDate(s){ return new Intl.DateTimeFormat("it-IT",{day:"numeric",month:"long",year:"numeric"}).format(new Date(s+"T12:00:00")); }
function shortDate(s){ return new Intl.DateTimeFormat("it-IT",{day:"2-digit",month:"short",year:"numeric"}).format(new Date(s+"T12:00:00")); }
function fmtTime(t){ return (t||"").slice(0,5); }
function parseDT(date,time){ return new Date(`${date}T${time||"00:00"}:00`); }
function money(v){ return new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"}).format(Number(v||0)); }
function clientObj(id){ return db.clients.find(x=>x.id===id); }
function serviceObj(id){ return db.services.find(x=>x.id===id); }
function initials(name){ const parts=(name||"").trim().split(/\s+/).slice(0,2); return parts.length ? parts.map(p=>p[0].toUpperCase()).join("") : "VC"; }
function escapeHTML(s){ return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m])); }
function attr(s){ return escapeHTML(s).replace(/`/g,"&#96;"); }
function paidTotal(items=db.appointments){ return items.filter(a=>a.paid).reduce((s,a)=>s+Number(a.price||0),0); }
function unpaidTotal(items=db.appointments){ return items.filter(a=>!a.paid).reduce((s,a)=>s+Number(a.price||0),0); }
function sameMonth(dateStr, refDate){ const d=new Date(dateStr+"T12:00:00"); return d.getMonth()===refDate.getMonth() && d.getFullYear()===refDate.getFullYear(); }
function monthEvents(refDate){ return [...db.appointments.filter(a=>sameMonth(a.date, refDate)).map(a=>({t:"w",dt:parseDT(a.date,a.time),x:a})), ...db.personal.filter(p=>sameMonth(p.date, refDate)).map(p=>({t:"p",dt:parseDT(p.date,p.time),x:p}))].sort((a,b)=>a.dt-b.dt); }
function allDayEvents(date){ return [...db.appointments.filter(a=>a.date===date).map(a=>({t:"w",dt:parseDT(a.date,a.time),x:a})), ...db.personal.filter(p=>p.date===date).map(p=>({t:"p",dt:parseDT(p.date,p.time),x:p}))].sort((a,b)=>a.dt-b.dt); }
function statusInfoWork(a){ return a.paid ? {cls:"ok", txt:"✓ Confermato"} : {cls:"wait", txt:"◔ Da confermare"}; }
function workColor(service){ return service?.category === "Unghie" ? "#c2ace5" : "#d98ca2"; }
function personalColor(){ return "#cdbab0"; }
function endTime(start, mins){ const [h,m]=start.split(":").map(Number); const d=new Date(2000,0,1,h,m||0); d.setMinutes(d.getMinutes()+Number(mins||0)); return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }

}


function openNewMenu(date=isoDate(new Date())){ showSheet(`<h2>Nuovo appuntamento</h2><p>Scegli cosa vuoi aggiungere in VC Beauty.</p><div class="actions"><button class="primary" onclick="openAppointment(null,'${date}')">💄💅 Lavoro</button><button class="secondary" onclick="openPersonal(null,'${date}')">👤 Personale</button></div>`); }
function openClient(id=null){ const c=id?db.clients.find(x=>x.id===id):{id:null,name:'',phone:'',instagram:'',address:'',city:'',notes:''}; const history=id?[...db.appointments.filter(a=>a.clientId===id)].sort((a,b)=>parseDT(b.date,b.time)-parseDT(a.date,a.time)):[]; const spent=paidTotal(history), due=unpaidTotal(history); showSheet(id ? `<div class="profile card"><div class="profile-top"><div class="profile-pic">${escapeHTML(initials(c.name))}</div><div><div class="profile-name">${escapeHTML(c.name)} <span class="profile-heart">♡</span></div><div class="profile-lines">${c.phone?`<div class="profile-line">📞 <span>+39 ${escapeHTML(c.phone)}</span></div>`:''}${c.instagram?`<div class="profile-line">📷 <span>${escapeHTML(c.instagram)}</span></div>`:''}${c.address?`<div class="profile-line">🏠 <span>${escapeHTML(c.address)}</span></div>`:''}${c.city?`<div class="profile-line">📍 <span>${escapeHTML(c.city)}</span></div>`:''}</div><div class="pill-actions"><button class="primary" onclick="openAppointment(null,'${isoDate(new Date())}','${c.id}')">Nuovo appuntamento</button><button class="secondary" onclick="openClientForm('${c.id}')">Modifica</button></div></div></div><div class="info-grid"><div class="card info-item"><div class="label">Appuntamenti</div><div class="val">${history.length}</div></div><div class="card info-item"><div class="label">Totale speso</div><div class="val">${money(spent)}</div></div><div class="card info-item"><div class="label">Da pagare</div><div class="val">${money(due)}</div></div><div class="card info-item"><div class="label">Note</div><div class="val">${c.notes ? escapeHTML(c.notes) : '—'}</div></div></div></div><div class="section-head"><h2>Storico appuntamenti</h2></div><div class="list">${history.length ? history.map(apptRow).join('') : '<div class="empty">Nessun appuntamento registrato.</div>'}</div>` : clientFormHTML(c)); }
function openClientForm(id){ const c=db.clients.find(x=>x.id===id); showSheet(clientFormHTML(c)); }
function clientFormHTML(c){ return `<h2>${c?.id?'Modifica cliente':'Nuova cliente'}</h2><form onsubmit="saveClient(event,'${c?.id||''}')"><label>Nome e cognome<input id="c_name" value="${attr(c?.name||'')}" required></label><label>Telefono<input id="c_phone" value="${attr(c?.phone||'')}" inputmode="tel"></label><label>Instagram<input id="c_instagram" value="${attr(c?.instagram||'')}"></label><label>Indirizzo<input id="c_address" value="${attr(c?.address||'')}" placeholder="Via, numero civico"></label><label>Paese / Città<input id="c_city" value="${attr(c?.city||'')}" placeholder="Es. Sant'Agata di Militello"></label><label>Note<textarea id="c_notes">${escapeHTML(c?.notes||'')}</textarea></label><div class="actions">${c?.id?`<button type="button" class="danger" onclick="deleteClient('${c.id}')">Elimina</button>`:''}<button class="primary">Salva</button></div></form>`; }
function saveClient(e,id){ e.preventDefault(); const obj={id:id||uid(),name:c_name.value.trim(),phone:c_phone.value.trim(),instagram:c_instagram.value.trim(),address:c_address.value.trim(),city:c_city.value.trim(),notes:c_notes.value.trim()}; const i=db.clients.findIndex(x=>x.id===id); if(i>=0) db.clients[i]=obj; else db.clients.push(obj); closeModal(); saveDB(); syncAllPushReminders().catch(()=>{}); }
function deleteClient(id){ if(!confirm('Eliminare la cliente e tutti i suoi appuntamenti?')) return; db.clients=db.clients.filter(x=>x.id!==id); db.appointments=db.appointments.filter(x=>x.clientId!==id); closeModal(); saveDB(); syncAllPushReminders().catch(()=>{}); }
function openService(id=null){ const s=id?db.services.find(x=>x.id===id):{id:null,name:'',category:'Make-up',price:0,duration:60}; showSheet(`<h2>${id?'Modifica servizio':'Nuovo servizio'}</h2><form onsubmit="saveService(event,'${id||''}')"><label>Nome servizio<input id="s_name" value="${attr(s.name)}" required></label><label>Categoria<select id="s_cat"><option ${s.category==='Make-up'?'selected':''}>Make-up</option><option ${s.category==='Unghie'?'selected':''}>Unghie</option></select></label><div class="twocol"><label>Prezzo (€)<input id="s_price" type="number" step=".01" value="${s.price}" required></label><label>Durata (minuti)<input id="s_dur" type="number" value="${s.duration}" required></label></div><div class="actions">${id?`<button type="button" class="danger" onclick="deleteService('${id}')">Elimina</button>`:''}<button class="primary">Salva</button></div></form>`); }
function saveService(e,id){ e.preventDefault(); const obj={id:id||uid(),name:s_name.value.trim(),category:s_cat.value,price:+s_price.value,duration:+s_dur.value}; const i=db.services.findIndex(x=>x.id===id); if(i>=0) db.services[i]=obj; else db.services.push(obj); closeModal(); saveDB(); syncAllPushReminders().catch(()=>{}); }
function deleteService(id){ if(!confirm('Eliminare il servizio?')) return; db.services=db.services.filter(x=>x.id!==id); closeModal(); saveDB(); syncAllPushReminders().catch(()=>{}); }
function openAppointment(id=null,date=isoDate(new Date()),preClient=null){ if(!db.clients.length){ alert('Aggiungi prima almeno una cliente.'); closeModal(); go('clients'); return; } if(!db.services.length){ alert('Aggiungi prima almeno un servizio.'); closeModal(); go('services'); return; } const a=id?db.appointments.find(x=>x.id===id):{id:null,clientId:preClient||db.clients[0].id,serviceId:db.services[0].id,date,time:'09:00',price:db.services[0].price,paid:false,notes:''}; showSheet(`<h2>${id?'Modifica appuntamento':'Nuovo appuntamento'}</h2><form onsubmit="saveAppointment(event,'${id||''}')"><label>Cliente<select id="a_client">${db.clients.map(c=>`<option value="${c.id}" ${c.id===a.clientId?'selected':''}>${escapeHTML(c.name)}</option>`).join('')}</select></label><label>Servizio<select id="a_service" onchange="syncAppointmentPrice()">${db.services.map(s=>`<option value="${s.id}" ${s.id===a.serviceId?'selected':''}>${escapeHTML(s.category+' — '+s.name)}</option>`).join('')}</select></label><div class="twocol"><label>Data<input id="a_date" type="date" value="${a.date}" required></label><label>Ora<input id="a_time" type="time" value="${a.time}" required></label></div><div class="twocol"><label>Prezzo (€)<input id="a_price" type="number" step=".01" value="${a.price}" required></label><label>Stato<select id="a_paid"><option value="0" ${!a.paid?'selected':''}>Da confermare</option><option value="1" ${a.paid?'selected':''}>Confermato</option></select></label></div><label>Note<textarea id="a_notes">${escapeHTML(a.notes||'')}</textarea></label><div id="conflictBox"></div><div class="actions">${id?`<button type="button" class="danger" onclick="deleteAppointment('${id}')">Elimina</button>`:''}<button class="primary">Salva appuntamento</button></div></form>`); }
function syncAppointmentPrice(){ const s=serviceObj(a_service.value); if(s) a_price.value=s.price; }
function conflictFor(date,time,duration,ignoreId=null,ignorePersonalId=null){ const start=parseDT(date,time), end=new Date(start.getTime()+Number(duration||0)*60000); const work=db.appointments.some(a=>{ if(a.id===ignoreId) return false; const s=serviceObj(a.serviceId); const st=parseDT(a.date,a.time), en=new Date(st.getTime()+Number(s?.duration||60)*60000); return start<en && end>st; }); const pers=db.personal.some(p=>{ if(p.id===ignorePersonalId) return false; const st=parseDT(p.date,p.time), en=new Date(st.getTime()+Number(p.duration||60)*60000); return start<en && end>st; }); return work || pers; }
function saveAppointment(e,id){ e.preventDefault(); const s=serviceObj(a_service.value), dur=s?.duration||60; if(conflictFor(a_date.value,a_time.value,dur,id||null,null)){ conflictBox.innerHTML='<div class="notice">Questo orario si sovrappone a un altro impegno.</div>'; return; } const obj={id:id||uid(),clientId:a_client.value,serviceId:a_service.value,date:a_date.value,time:a_time.value,price:+a_price.value,paid:a_paid.value==='1',notes:a_notes.value.trim()}; const i=db.appointments.findIndex(x=>x.id===id); if(i>=0) db.appointments[i]=obj; else db.appointments.push(obj); closeModal(); saveDB(); syncAllPushReminders().catch(()=>{}); }
function deleteAppointment(id){ if(!confirm('Eliminare questo appuntamento?')) return; db.appointments=db.appointments.filter(x=>x.id!==id); closeModal(); saveDB(); syncAllPushReminders().catch(()=>{}); }
function openPersonal(id=null,date=isoDate(new Date())){ const p=id?db.personal.find(x=>x.id===id):{id:null,title:'',date,time:'15:00',duration:60,notes:''}; showSheet(`<h2>${id?'Modifica impegno':'Nuovo impegno personale'}</h2><form onsubmit="savePersonal(event,'${id||''}')"><label>Impegno<input id="p_title" value="${attr(p.title)}" required></label><div class="twocol"><label>Data<input id="p_date" type="date" value="${p.date}" required></label><label>Ora<input id="p_time" type="time" value="${p.time}" required></label></div><label>Durata (minuti)<input id="p_dur" type="number" value="${p.duration||60}" required></label><label>Note<textarea id="p_notes">${escapeHTML(p.notes||'')}</textarea></label><div id="pConflict"></div><div class="actions">${id?`<button type="button" class="danger" onclick="deletePersonal('${id}')">Elimina</button>`:''}<button class="primary">Salva</button></div></form>`); }
function savePersonal(e,id){ e.preventDefault(); if(conflictFor(p_date.value,p_time.value,+p_dur.value,null,id||null)){ pConflict.innerHTML='<div class="notice">Questo orario si sovrappone a un altro impegno.</div>'; return; } const obj={id:id||uid(),title:p_title.value.trim(),date:p_date.value,time:p_time.value,duration:+p_dur.value,notes:p_notes.value.trim()}; const i=db.personal.findIndex(x=>x.id===id); if(i>=0) db.personal[i]=obj; else db.personal.push(obj); closeModal(); saveDB(); syncAllPushReminders().catch(()=>{}); }
function deletePersonal(id){ if(!confirm('Eliminare questo impegno?')) return; db.personal=db.personal.filter(x=>x.id!==id); closeModal(); saveDB(); syncAllPushReminders().catch(()=>{}); }
function exportBackup(){ const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`vc-beauty-backup-${isoDate(new Date())}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function importBackup(){ showSheet(`<h2>Ripristina backup</h2><p>Seleziona un file JSON esportato da VC Beauty.</p><input type="file" id="backupFile" accept=".json,application/json"><div class="actions"><button class="primary" onclick="doImport()">Importa backup</button></div>`); }
function doImport(){ const f=backupFile.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.clients || !d.services || !d.appointments || !d.personal) throw new Error(); d.clients=d.clients.map(c=>({...c,address:c.address||'',city:c.city||''})); db=d; closeModal(); saveDB(); alert('Backup importato.'); }catch(e){ alert('Backup non valido.'); } }; r.readAsText(f); }
function resetAll(){ if(!confirm('Vuoi azzerare tutti i dati?')) return; db={clients:[],services:JSON.parse(JSON.stringify(DEFAULT_SERVICES)),appointments:[],personal:[]}; saveDB(); syncAllPushReminders().catch(()=>{}); }
function showSheet(html){ document.getElementById('sheet').innerHTML=html; document.getElementById('modal').classList.add('show'); }
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
window.addEventListener('load',()=>initOneSignalPush());
render();
</script>
</body>
</html>
